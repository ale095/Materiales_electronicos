<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construcción de prototipos electrónicos – 8vo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--a:#14b8a6;--b:#0f766e;--t:#99f6e4}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0a0e27,#1e1b4b 35%,#0f766e 70%,#134e4a);background-size:300% 300%;animation:bg 18s ease infinite;color:#fff;font:500 17px/1.4 Syne,"Trebuchet MS",Verdana,sans-serif;overflow-x:hidden;min-height:100vh}
@keyframes bg{50%{background-position:100% 50%}}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
h1{font:800 clamp(28px,6vw,56px)/1.05 Syne,sans-serif;text-align:center;margin:.1em 0;text-shadow:0 3px 0 #0f766e,0 0 24px #22d3ee88}
.scr{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 14px;min-height:100vh;display:flex;flex-direction:column;gap:12px;animation:in .5s ease}
.btn{font:800 clamp(16px,3.6vw,24px) Syne,sans-serif;color:#1a1040;background:#fbbf24;border:2px solid #fff;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 7px 0 #b45309;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b45309}
.btn-g{background:#22d3ee;border:3px solid #fff;box-shadow:0 5px 0 #0e7490;padding:8px 26px;font-size:clamp(14px,3vw,20px)}
.btn-p{box-shadow:0 8px 0 #b45309;min-width:min(80%,420px)}
.card{background:linear-gradient(135deg,#14b8a6,#0f766e);border-radius:26px;padding:16px 22px;box-shadow:0 10px 0 #134e4a}
.card b{display:block;text-align:center;font-weight:800;margin-bottom:4px}
.hint{text-align:center;font-size:14px;opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bar{height:10px;background:#fff;border:2px solid #000;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fbbf24;transition:width .4s}
.opt{text-align:left;width:100%;border-radius:20px;color:#1a1040;background:#fbbf24;border:2px solid #fff;padding:12px 18px;font:700 clamp(15px,2.4vw,19px) Syne,sans-serif;cursor:pointer;box-shadow:0 4px 0 #b45309}
.opt.ok{background:#b9f0cd;box-shadow:0 4px 0 #4a9c6b}
.opt.no{background:#ffc9c9;box-shadow:0 4px 0 #9c4a4a}
.vp,.qvp{position:relative;border-radius:26px;border:3px solid #22d3ee;background:radial-gradient(circle at 50% 30%,#0d9488,#0a0e27);box-shadow:0 0 28px #22d3ee55;overflow:hidden;touch-action:none;cursor:grab}
.vp{min-height:300px;height:44vh}
.qvp{flex:1;min-height:240px;max-height:360px;border-radius:18px}
.vp canvas,.qvp canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:1}
#arv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.vp.ar{position:fixed;inset:0;z-index:50;height:auto;min-height:0;border-radius:0;border:0;background:#000}
body.ar{overflow:hidden}
body.ar .tb{position:fixed;left:0;right:0;bottom:0;z-index:60;border-radius:14px 14px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
body.ar #popup{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60}
.vid{width:100%;aspect-ratio:16/9;border:3px solid #22d3ee;border-radius:20px;background:#000}
.big{font-size:clamp(70px,20vw,140px);text-align:center;margin:0}
.home{position:fixed;right:10px;top:10px;z-index:9;background:none;border:0;cursor:pointer;width:42px;padding:0}
.fb{position:fixed;top:14px;left:14px;z-index:20;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c3aed,#4c1d95);color:#fbbf24;border:3px solid #fbbf24;border-radius:50%;font:800 24px Syne,sans-serif;cursor:pointer;box-shadow:0 6px 0 rgba(76,29,149,.7);padding:0}
.dec{position:fixed;width:clamp(70px,15vw,200px);z-index:0;pointer-events:none;animation:fl 6s ease-in-out infinite;opacity:.9}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:auto;gap:12px}
.nav .btn-g{min-width:140px;text-align:center;font-size:16px;padding:10px 24px}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%;max-width:1000px;margin:8px auto}
@media(max-width:560px){.mg{grid-template-columns:1fr}}
.mc{background:linear-gradient(160deg,rgba(20,184,166,.85),rgba(15,118,110,.95));border:2px solid rgba(34,211,238,.5);border-radius:20px;padding:18px;cursor:pointer;color:#fff;text-align:left;font-family:Syne,sans-serif;box-shadow:0 10px 0 rgba(26,26,92,.6);min-height:170px;display:flex;flex-direction:column;animation:fl 2.5s ease-in-out infinite}
.mc:hover{border-color:#fbbf24}
.mch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mci,.cbi{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;min-width:48px;background:rgba(10,14,39,.85);border:2px solid rgba(34,211,238,.5);border-radius:14px;font-size:26px}
.mcn,.cbn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;background:#fbbf24;color:#1a1040;border-radius:999px;font-weight:800;font-size:13px;border:2px solid #fff}
.mct,.cbt{font-weight:800;font-size:16px;line-height:1.2;margin-bottom:6px}
.mcd,.cbd{font-size:13px;line-height:1.4;color:#ccfbf1}
.mcd{flex:1;margin-bottom:10px}
.mcc{font-weight:700;font-size:13px;color:#fbbf24;text-transform:uppercase}
.mc.aux{background:linear-gradient(160deg,rgba(123,63,196,.85),rgba(74,32,128,.95));border-color:rgba(244,114,182,.5);box-shadow:0 10px 0 rgba(42,16,80,.6)}
.mc.aux .mcn{background:#f472b6;color:#fff}
.cl{display:flex;flex-direction:column;gap:12px;width:100%;max-width:720px;margin:0 auto;flex:1}
.cb{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.35);border-radius:18px;padding:16px 20px;cursor:pointer;color:#fff;text-align:left;font-family:Syne,sans-serif;box-shadow:0 8px 0 rgba(26,26,92,.6);animation:fl 2.5s ease-in-out infinite}
.cb:hover{border-color:#fbbf24}
.cbn{background:var(--t)}
.cb .cbd{color:#fff;opacity:.9}
.cba{font-size:24px;color:var(--t);font-weight:800}
.to{--a:#fb923c;--b:#c2410c;--t:#fed7aa}.ta{--a:#fbbf24;--b:#b45309;--t:#fef3c7}.tt{--a:#14b8a6;--b:#0f766e;--t:#99f6e4}.ty{--a:#eab308;--b:#a16207;--t:#fef08a}.tp{--a:#ec4899;--b:#9d174d;--t:#fbcfe8}.tv{--a:#8b5cf6;--b:#5b21b6;--t:#ddd6fe}
.tb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 8px;background:rgba(10,14,39,.75);border-radius:14px;border:1px solid #22d3ee44;margin-top:4px}
.tbt{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(20,184,166,.4);border:2px solid #22d3ee66;border-radius:12px;color:#fff;font:700 13px Syne,sans-serif;cursor:pointer;white-space:nowrap}
.tbt.act{background:linear-gradient(135deg,#fbbf24,#f472b6);border-color:#fff;color:#1a1040}
.ql{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.ql{grid-template-columns:1fr}}
.qh{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:8px 12px;font-size:13px;color:#fff5d0}
.qf{text-align:center;font-weight:700;padding:4px;color:#22d3ee;font-size:14px}
.qlb{text-align:center;font-weight:800;font-size:14px;color:#fbbf24;text-transform:uppercase;min-height:20px}
.qt{text-align:center;font-size:12px;opacity:.7}
.tag{display:inline-block;background:#fbbf24;color:#1a1040;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px}
.ip{background:rgba(10,14,39,.88);border:2px solid #22d3ee;border-radius:14px;padding:12px 16px;margin-top:8px}
.ip b{color:#fbbf24;font-size:17px;display:block;margin-bottom:4px}
.ip p{margin:0;font-size:14px}
.ip button{float:right;background:rgba(255,80,80,.2);border:1px solid #f472b6;border-radius:50%;width:28px;height:28px;color:#fff;cursor:pointer;font-weight:800;margin-left:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="decor"></div>
<button class="home" onclick="go('menu')" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="M12 2 1 12h3v10h6v-6h4v6h6V12h3z" fill="#ff3b3b"/></svg></button>
<button class="fb" id="fbtn" onclick="go('f0')">F</button>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO={led:['LED','Emite luz cuando pasa corriente. La pata larga va al positivo (+).'],res:['Resistencia','Frena el paso de la corriente. Sus franjas de colores indican su valor.'],transistor:['Transistor','Interruptor o amplificador: con una señal pequeña controla una corriente mayor.'],diodo:['Diodo','Deja pasar la corriente en un solo sentido, como una puerta de una sola vía.'],ldr:['LDR','Resistencia que cambia con la luz. Se usa en luces que se encienden de noche.'],rele:['Relevador','Interruptor que se activa con electricidad: con poca corriente mueve mecanismos de más potencia.'],pot:['Potenciómetro','Resistencia que cambias girando la perilla, como el volumen de una radio.'],fus:['Fusible','Se funde y corta el circuito si pasa demasiada corriente.'],ci:['Circuito integrado','Chip con miles de componentes diminutos que realiza tareas completas.'],cap:['Capacitor','Guarda energía por un momento y la suelta cuando el circuito la necesita.'],bob:['Bobina','Alambre enrollado que guarda energía en un campo magnético. Se usa en timbres y motores.'],termistor:['Termistor','Su resistencia cambia con la temperatura. Se usa en termómetros y alarmas de calor.'],pila:['Pila','La fuente de energía: empuja la corriente por todo el circuito.'],prot:['Protoboard','Tablero con agujeros para conectar componentes sin soldar.'],cab:['Cables','Conducen la corriente. Son de cobre cubierto con plástico aislante.'],port:['Portapilas','Sostiene las pilas y las conecta al circuito.'],sold:['Cautín','Herramienta que calienta el estaño para unir componentes.'],motor:['Motor DC','Convierte la energía eléctrica en movimiento giratorio.'],buzzer:['Buzzer (zumbador)','Emite un sonido cuando recibe corriente. Se usa en alarmas y timbres.'],pir:['Sensor PIR','Detecta movimiento por el calor de las personas. Se usa en alarmas y luces automáticas.'],arduino:['Arduino Uno','Microcontrolador programable: el cerebro del prototipo.'],lcd:['Display LCD','Pantalla de texto que muestra información. Se conecta a Arduino.']};
const CONT=[{t:'Componentes electrónicos y sus funciones',p:'Los componentes electrónicos permiten construir circuitos y prototipos que emiten luz, controlan el paso de corriente o activan mecanismos.',s:'items',icon:'🔌',short:'LED, transistor, resistencia, capacitor, diodo y más',theme:'to',l:['termistor','transistor','diodo','ldr','rele','led','pot','fus','ci','res','cap','bob']},{t:'Materiales y herramientas',p:'Los materiales unen los componentes y las herramientas te ayudan a armar el prototipo.',s:'items',icon:'🛠️',short:'Protoboard, cables, portapilas y cautín',theme:'ta',l:['prot','cab','port','sold']},{t:'Componentes activos y sensores',p:'Estos componentes hacen que tu prototipo cobre vida: gira, suena, detecta y piensa.',s:'items',icon:'🤖',short:'Motor, buzzer, sensor PIR, Arduino y LCD',theme:'tt',l:['motor','buzzer','pir','arduino','lcd']},{t:'Conexiones en serie y sus aplicaciones',p:'En serie, los componentes van uno tras otro en un solo camino. Se usa en luces de adorno y linternas.',s:'serie',icon:'🔗',short:'Un solo camino: si un foco falla, se apagan todos',theme:'ty'},{t:'Conexiones en paralelo y sus aplicaciones',p:'En paralelo, cada componente tiene su propio camino a la pila. Se usa en las luces de una casa.',s:'par',icon:'🔀',short:'Cada foco tiene su camino: si uno falla, los demás siguen',theme:'tp'},{t:'¡Arma tu prototipo!',p:'Una pila, una resistencia y un LED sobre una protoboard forman tu primer circuito.',s:'mini',icon:'🚀',short:'Tu primer circuito funcional sobre la protoboard',theme:'tv'}];
const FUND=[['Criterio de evaluación','Identificar los componentes y materiales básicos para construir un prototipo y reconocer la función de cada uno.'],['DESTREZA CON CRITERIO DE DESEMPEÑO','PR.4.1.10. Identificar los componentes y materiales básicos para la construcción de un prototipo, reconociendo su función.'],['Indicadores de logro','Reconoces componentes electrónicos y su función. Nombras materiales y herramientas. Explicas la diferencia entre conexión en serie y en paralelo.']];
const QS=[{q:'¿Qué componente emite luz?',options:['LED','Resistencia','Fusible'],answer:0,model:'led',hint:'Mira el modelo 3D: ¿qué componente tiene una cúpula de vidrio?'},{q:'¿Para qué sirve un fusible?',options:['Guarda música','Corta el circuito si pasa demasiada corriente','Hace más grande la pila'],answer:1,model:'fus',hint:'Observa el tubo de vidrio con un hilo metálico en su interior.'},{q:'¿Qué material permite armar circuitos sin soldar?',options:['Una regla','Un cuaderno','La protoboard'],answer:2,model:'prot',hint:'Fíjate en el tablero blanco con muchos agujeros pequeños.'},{q:'En serie, si quitas un foco, ¿qué pasa con los demás?',options:['Se apagan todos','Siguen encendidos','Brillan el doble'],answer:0,model:'serie',hint:'En serie hay un solo camino: si se rompe, se corta todo.'},{q:'En paralelo, si quitas un foco, ¿qué pasa con los demás?',options:['Se apagan todos','Siguen encendidos','Explotan'],answer:1,model:'par',hint:'En paralelo cada foco tiene su propio camino a la pila.'}];

const FB=[
{ok:'¡Excelente! El LED es el componente que emite luz cuando pasa corriente por él.',no:'El LED (diodo emisor de luz) es el que produce luz. La resistencia limita la corriente y el fusible protege el circuito, pero ninguno de los dos ilumina. Repasa el contenido de componentes.'},
{ok:'¡Muy bien! El fusible se funde y corta el circuito cuando pasa demasiada corriente, protegiendo los demás componentes.',no:'El fusible es un elemento de protección: su hilo metálico se funde y corta el paso de corriente si ésta es excesiva. No guarda música ni modifica la pila. Vuelve a observar su modelo 3D.'},
{ok:'¡Correcto! La protoboard permite conectar componentes sin soldar, gracias a sus agujeros con conexiones internas.',no:'La protoboard es la placa con agujeros que permite armar y probar circuitos sin soldar. Una regla o un cuaderno no conducen electricidad. Repasa los materiales y herramientas.'},
{ok:'¡Perfecto! En serie solo hay un camino para la corriente, por eso si quitas un foco se apagan todos.',no:'En un circuito en serie hay un solo camino: si quitas un foco, el circuito se abre y se apagan todos. Los focos no brillan más ni siguen encendidos. Prueba quitar un foco en el contenido de serie.'},
{ok:'¡Muy bien! En paralelo cada foco tiene su propio camino, así que los demás siguen encendidos.',no:'En paralelo cada foco tiene su propio camino hacia la pila, por eso al quitar uno los demás siguen encendidos. No se apagan ni explotan. Repasa el contenido de circuito en paralelo.'}
];

// Decoración
const gear=(x,y,r,n,f)=>{let p='';for(let i=0;i<n*2;i++){const a=i*Math.PI/n,q=i%2?r:r*1.2;p+=(x+Math.cos(a)*q).toFixed(1)+','+(y+Math.sin(a)*q).toFixed(1)+' '}return `<polygon points="${p}" fill="${f}"/><circle cx="${x}" cy="${y}" r="${r*.45}" fill="#0a0e27"/>`};
document.getElementById('decor').innerHTML=[['left:0;top:0','#f472b6'],['right:0;top:0','#7c3aed'],['left:0;bottom:0','#fbbf24'],['right:0;bottom:0','#22d3ee']].map((d,i)=>`<svg class="dec" viewBox="0 0 200 200" style="${d[0]};animation-delay:${-i*1.5}s">${gear(70,70,45,8,d[1])}${gear(150,120,30,8,'#134e4a')}</svg>`).join('');

// Estado
const app=document.getElementById('app');
let screen='portada',qi=0,score=0,answered=false,picked=null,finished=false,stage='q';
let mv=0,lx=0,ci=0,on=1,gone=[],EX=0,exv=0,R,S,C,cur,fit,arStream=null;
const pt=new Map();

// Helpers Three.js
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const P=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:0},o||{}));
const M=(g,m,x,y,z)=>{const me=new THREE.Mesh(g,m);me.position.set(x||0,y||0,z||0);me.castShadow=me.receiveShadow=true;return me};
const Cy=(r,h,m,x,y,z,rz,rx)=>{const me=M(new THREE.CylinderGeometry(r,r,h,32),m,x,y,z);if(rz)me.rotation.z=rz;if(rx)me.rotation.x=rx;return me};
const Bo=(w,h,d,m,x,y,z)=>M(new THREE.BoxGeometry(w,h,d),m,x,y,z);
const Sp=(r,m,x,y,z)=>M(new THREE.SphereGeometry(r,32,16),m,x,y,z);
const tube=(pts,r,c)=>M(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,r,8),P(c,{metalness:.8,roughness:.3}));
const MT=()=>P(0xc0c0c0,{metalness:1,roughness:.22});
const lead=(x,y,z,h)=>Cy(.03,h||.6,MT(),x,y,z);
function protoTex(){const c=document.createElement('canvas');c.width=640;c.height=420;const x=c.getContext('2d');x.fillStyle='#f3f0e6';x.fillRect(0,0,640,420);x.fillStyle='#333';for(let i=0;i<30;i++)for(let j=0;j<5;j++){x.fillRect(30+i*19.5,70+j*28,8,8);x.fillRect(30+i*19.5,232+j*28,8,8)}const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function label(t){const c=document.createElement('canvas');c.width=320;c.height=80;const x=c.getContext('2d');x.font='800 32px Syne,Arial Black,sans-serif';x.textAlign='center';x.textBaseline='middle';x.strokeStyle='#1a1040';x.lineWidth=8;x.strokeText(t,160,42);x.fillStyle='#fbbf24';x.fillText(t,160,42);const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));s.scale.set(2.5,.6,1);return s}

// Modelos 3D
const B={};
B.led=()=>{const m=P(0xff5544,{transparent:true,opacity:.55,roughness:.05,emissive:0xff3322,emissiveIntensity:1.2});const g=new THREE.Group();g.add(Cy(.5,.08,P(0x1a1a1a),0,.95),Cy(.4,.5,m,0,1.25),M(new THREE.SphereGeometry(.4,32,16,0,6.283,0,1.5708),m,0,1.5),Bo(.06,.6,.04,MT(),-.1,.65),Bo(.06,1.1,.04,MT(),.1,.4));g.userData.mat=m;g.userData.k='led';return g};
B.res=()=>{const g=new THREE.Group();g.rotation.z=1.5708;g.position.y=.32;g.add(Cy(.18,.8,P(0xe3cc9c,{roughness:.6})),Cy(.19,.1,P(0xc0a060,{metalness:1,roughness:.3}),0,-.42,0),Cy(.19,.1,P(0xc0a060,{metalness:1,roughness:.3}),0,.42,0),lead(0,0,0,2));[[0xcc2222,-.22],[0x7a3b10,-.05],[0x1d4ed8,.12],[0xfbbf24,.3]].forEach(b=>g.add(Cy(.186,.07,P(b[0]),0,b[1],0)));g.userData.k='res';return g};
B.transistor=()=>{const g=new THREE.Group();g.add(Bo(.95,1.1,.35,P(0x151515),0,.95),Bo(.04,.4,.04,MT(),-.32,.2),Bo(.04,.4,.04,MT(),0,.2),Bo(.04,.4,.04,MT(),.32,.2));g.userData.k='transistor';return g};
B.diodo=()=>{const g=new THREE.Group();g.rotation.z=1.5708;g.position.y=.3;g.add(Cy(.25,.9,P(0x1a1a1a)),Cy(.26,.12,P(0xc0c0c0,{metalness:1,roughness:.3}),0,.28,0),lead(0,0,0,2.4));g.userData.k='diodo';return g};
B.ldr=()=>{const g=new THREE.Group();g.add(Cy(.5,.1,P(0xd99a45,{roughness:.4}),0,1,0,0,1.5708),lead(-.2,.3,.06),lead(.2,.3,.06));g.userData.k='ldr';return g};
B.rele=()=>{const g=new THREE.Group();g.add(Bo(1.3,.9,.9,P(0x1d5ec7),0,.85),Bo(1.2,.02,.35,P(0xffffff),0,1.31));[-.4,0,.4].forEach(x=>g.add(lead(x,.2,.3,.4)));g.userData.k='rele';return g};

function buildScene(kind,list,nl){
  const g=new THREE.Group();
  if(kind==='items'){
    const cols=Math.min(list.length,list.length>5?4:3),rows=Math.ceil(list.length/cols);
    list.forEach((k,i)=>{
      const x=(i%cols-(cols-1)/2)*3.8,z=(Math.floor(i/cols)-(rows-1)/2)*3.8,m=B[k]();
      m.position.x+=x;m.position.z+=z;g.add(m);
      const pd=Cy(1.3,.12,P(0x1a1f4e,{roughness:.2,metalness:.35}),x,-.08,z);pd.raycast=()=>{};g.add(pd);
      if(!nl){const s=label(INFO[k][0]);s.position.set(x,2.5,z);g.add(s)}
    });
    g.userData.items=true;g.userData.dim=[cols*3.8+1,rows*3.8+2.5,Math.hypot(cols,rows)*3.2];
  } else if(kind==='serie'||kind==='par'){
    const bs=[],paths=[],A=(x,y)=>V3(x,y,0);
    const pila=B.pila();pila.position.set(-3.2,-.57,0);g.add(pila);
    if(kind==='serie'){[-1.5,0,1.5].forEach(x=>bs.push([x,.75]));paths.push([A(-3.2,.55),A(-3.2,1),A(3,1),A(3,-1),A(-3.2,-1),A(-3.2,-.55)])}
    else{[-1,.5,2].forEach(x=>bs.push([x,.75]));[-1,.5,2].forEach(x=>paths.push([A(-3.2,.55),A(-3.2,1.5),A(x,1.5),A(x,.75),A(x,-1.5),A(-3.2,-1.5),A(-3.2,-.55)]))}
    paths.forEach(p=>g.add(M(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p),48,.07,8),P(0xd9822b,{metalness:.8,roughness:.3}))));
    g.bs=bs.map(([x,y],i)=>{const b=B.bulb();b.userData.i=i;b.position.set(x,y,0);g.add(b);return b});
    g.el=[];paths.forEach(p=>{p.L=0;for(let i=1;i<p.length;i++)p.L+=p[i].distanceTo(p[i-1]);const n=Math.round(p.L/1.1);for(let i=0;i<n;i++){const e=Sp(.18,P(0x22d3ee));e.raycast=()=>{};e.userData.u=i/n;e.userData.p=p;g.add(e);g.el.push(e)}});
    g.userData.dim=[9,kind==='par'?5.5:4.5,9];
  } else if(kind==='mini'){
    g.add(B.prot());
    const led=B.led();led.scale.setScalar(.5);led.position.set(-.8,.16,.5);g.add(led);
    const res=B.res();res.scale.setScalar(.6);res.position.set(.4,.18,-.4);g.add(res);
    const pila=B.pila();pila.scale.setScalar(.5);pila.rotation.z=1.5708;pila.position.set(1.7,.4,.7);g.add(pila);
    g.userData.items=true;g.userData.dim=[5,3.5,5];
  }
  return g;
}

function init3D(elId,kind,list,nl){
  const el=document.getElementById(elId);if(!el)return;
  if(!R){R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setClearColor(0x000000,0);R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;R.shadowMap.enabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2))}
  S=new THREE.Scene();C=new THREE.PerspectiveCamera(45,1,.1,100);
  el.querySelectorAll('canvas').forEach(c=>c.remove());el.appendChild(R.domElement);
  S.add(new THREE.AmbientLight(0xffffff,.6));
  const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,6,4);dl.castShadow=true;S.add(dl);
  const dl2=new THREE.DirectionalLight(0x9fc4ff,.4);dl2.position.set(-4,3,-4);S.add(dl2);
  cur=buildScene(kind,list,nl);S.add(cur);exv=0;
  fit=()=>{
    R.setSize(el.clientWidth,el.clientHeight);C.aspect=el.clientWidth/el.clientHeight;C.updateProjectionMatrix();
    const d0=cur.userData.dim||[4,3.5,4];
    const d=Math.max(d0[1]/2/.414,Math.max(d0[0],d0[2]*.9)/2/(.414*C.aspect))*1.12;
    C.position.set(0,d*.3+.9,d);C.lookAt(0,.8,0);
  };
  fit();
  const cv=R.domElement;let pd0=0,sc0=1;
  const two=()=>{const[a,b]=[...pt.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  cv.onpointerdown=e=>{pt.set(e.pointerId,e);cv.setPointerCapture(e.pointerId);mv=0;lx=e.clientX;if(pt.size===2){pd0=two();sc0=cur.scale.x}};
  cv.onpointermove=e=>{if(!pt.has(e.pointerId))return;pt.set(e.pointerId,e);if(pt.size===2){cur.scale.setScalar(Math.min(3,Math.max(.3,sc0*two()/pd0)));mv=99;return}mv+=Math.abs(e.clientX-lx);cur.rotation.y+=(e.clientX-lx)*.012;lx=e.clientX};
  cv.onpointercancel=e=>pt.delete(e.pointerId);
  cv.onpointerup=e=>{const n=pt.size;pt.delete(e.pointerId);if(n>1||mv>5)return;const r=cv.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);const rc=new THREE.Raycaster;rc.setFromCamera(v,C);const h=rc.intersectObjects(cur.children,true);if(!h.length)return;let o=h[0].object;while(o&&o.userData.k===undefined)o=o.parent;if(o&&o.userData.k)choose(o)};
  window._resize=()=>{if(fit)fit()};
  upd();
}

const curS=()=>screen==='q'?QS[qi].model:(CONT[ci]?CONT[ci].s:'');
function upd(){
  if(!cur||!cur.bs)return;
  const s=curS();
  cur.bs.forEach((b,j)=>{
    b.visible=!gone.includes(j);
    const act=on&&b.visible&&(s==='par'||gone.length===0);
    b.userData.mat.emissiveIntensity=act?1.8:0;b.userData.mat.opacity=act?.7:.4;
  });
  const h=document.getElementById('hint');
  if(h)h.textContent=(s==='serie'||s==='par')?(on?'Toca un foco para quitarlo · gira con un dedo · pellizca para el tamaño':'Interruptor apagado: no pasa corriente'):'Toca un elemento · un dedo gira · dos dedos cambian el tamaño';
}
function choose(o){
  if(o.userData.k==='bulb'){const i=o.userData.i;gone=gone.includes(i)?gone.filter(x=>x!==i):[...gone,i];upd();return}
  showPopup(o);
}
function showPopup(o){
  const k=o.userData.k,p=document.getElementById('popup');if(!INFO[k]||!p)return;
  p.innerHTML=`<div class="ip"><button onclick="closePop()">✕</button><b>${INFO[k][0]}</b><p>${INFO[k][1]}</p></div>`;
}
function closePop(){const p=document.getElementById('popup');if(p)p.innerHTML=''}

function loop(){
  requestAnimationFrame(loop);
  if(!cur||!cur.parent||!R)return;
  const t=Date.now()*.001;
  if(cur.el){const s=curS();cur.el.forEach(e=>{const p=e.userData.p,f=on&&(s==='par'||gone.length===0);e.visible=f;if(f){e.userData.u=(e.userData.u+.035/Math.max(1,p.L/6))%1;let d=e.userData.u*p.L;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],l=a.distanceTo(b);if(d<=l){e.position.copy(a.clone().lerp(b,d/l));break}d-=l}}})}
  if(!pt.size)cur.rotation.y+=.003;
  exv+=(EX-exv)*.1;
  cur.children.forEach((o,j)=>{
    if(o.userData.k==='led')o.userData.mat.emissiveIntensity=.6+.4*Math.sin(t*4);
    if(o.userData.rot)o.userData.rot.rotation.y+=.15;
    if(cur.userData.items&&o.userData.k!==undefined){
      if(o.userData.y0===undefined)o.userData.y0=o.position.y;
      o.position.y=o.userData.y0+Math.sin(t*1.5+j*.5)*.06;
      if(!o.userData.cen){const k=o.children.filter(c=>c.isMesh);o.userData.cen=k.reduce((a,c)=>a.add(c.position),V3(0,0,0)).multiplyScalar(1/Math.max(1,k.length));k.forEach(c=>c.userData.p0=c.position.clone())}
      o.children.forEach(c=>{if(c.userData.p0)c.position.copy(c.userData.p0).add(c.userData.p0.clone().sub(o.userData.cen).multiplyScalar(exv*2))});
    }
  });
  R.render(S,C);
}

    return `<section class="scr"><div style="text-align:center"><span class="tag" style="background:#f472b6;color:#fff">RETROALIMENTACIÓN · PREGUNTA ${qi+1} DE ${QS.length}</span></div><div class="bar"><i style="width:${(qi+1)*20}%"></i></div><p class="big">${good?'🎉':'💪'}</p><div class="card" style="text-align:center;${good?'':'background:linear-gradient(135deg,#f59e0b,#b45309);box-shadow:0 10px 0 #78350f'}"><b style="font-size:clamp(22px,4.4vw,36px)">${good?'¡Respuesta correcta!':'Debes mejorar'}</b><p style="margin-top:6px">${good?FB[qi].ok:FB[qi].no}</p></div>${good?'':`<div class="qh" style="font-size:15px">Tu respuesta: <b style="display:inline;color:#ffc9c9">${String.fromCharCode(65+picked)}. ${q.options[picked]}</b><br>Respuesta correcta: <b style="display:inline;color:#b9f0cd">${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b></div>`}<div class="qf">Puntaje acumulado: ${score*2} / 10</div>${navRow(null,'nextQ()',last?'Ver resultado 🏆':'Siguiente pregunta →')}</section>`}
  const q=QS[qi],nm=q.model==='serie'?'Circuito en serie':q.model==='par'?'Circuito en paralelo':INFO[q.model][0];
  return `<section class="scr"><div style="text-align:center"><span class="tag" style="background:#f472b6;color:#fff">EVALUACIÓN SUMATIVA · SOBRE 10 PUNTOS · CADA PREGUNTA VALE 2</span></div><h1 style="font-size:clamp(20px,4vw,32px)">Pregunta ${qi+1} de ${QS.length}</h1><div class="bar"><i style="width:${qi*20}%"></i></div><div class="ql"><div style="display:flex;flex-direction:column;gap:8px"><div class="card" style="font-size:15px;padding:12px 16px"><b>${q.q}</b></div><div class="qh">💡 ${q.hint}</div>${q.options.map((o,j)=>`<button class="opt${answered?(j===q.answer?' ok':j===picked?' no':''):''}" onclick="ans(${j})" ${answered?'disabled':''}>${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<div class="qf">${answered?(picked===q.answer?'✅ ¡Correcto! 🎉':'❌ La respuesta correcta está en verde.'):'👆 Selecciona una opción'}</div></div><div style="display:flex;flex-direction:column;gap:6px"><div class="qlb">${answered?nm:'¿Qué ves en el modelo?'}</div><div id="qv" class="qvp"></div><div class="qt">🔄 Gira el modelo con un dedo o el mouse</div></div></div><div class="row"><button class="btn btn-g" onclick="go('menu')">Menú</button></div></section>`;
}

// Barra de herramientas (sin reconstruir la escena)
function rTb(){
  const tb=document.getElementById('tb')||document.getElementById('ht');if(!tb)return;
  const c=CONT[ci],circ=screen.startsWith('c')&&screen!=='contenidos'&&(c.s==='serie'||c.s==='par');
  tb.innerHTML=(circ?'':`<button class="tbt ${EX?'act':''}" onclick="EX=EX?0:1;rTb()">🔍 Vista explosionada</button>`)+`<button class="tbt ${arStream?'act':''}" onclick="toggleAR()">📷 ${arStream?'Salir de AR':'Ver en AR'}</button>`+(circ?`<button class="tbt ${on?'act':''}" onclick="on=on?0:1;upd();rTb()">🔌 ${on?'ON':'OFF'}</button><button class="tbt" onclick="gone=[];upd()">💡 Resetear focos</button>`:'');
}

// Realidad aumentada: cámara trasera detrás del canvas transparente
async function toggleAR(){
  if(arStream){stopAR();rTb();return}
  const el=document.getElementById('vv')||document.getElementById('hv');if(!el)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Tu navegador no permite usar la cámara. Abre la página con https en Chrome o Safari.');return}
  try{
    arStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=document.createElement('video');v.id='arv';v.srcObject=arStream;v.muted=true;v.autoplay=true;v.setAttribute('playsinline','');
    el.insertBefore(v,el.firstChild);el.classList.add('ar');document.body.classList.add('ar');
    v.play().catch(()=>{});
    if(cur)cur.scale.setScalar(.8);
    setTimeout(()=>fit&&fit(),80);rTb();
  }catch(e){arStream=null;alert('No se pudo abrir la cámara. Permite el acceso a la cámara y abre la página con https.')}
}
function stopAR(){
  if(arStream){arStream.getTracks().forEach(t=>t.stop());arStream=null}
  document.querySelectorAll('#arv').forEach(v=>v.remove());
  document.querySelectorAll('.vp.ar').forEach(e=>e.classList.remove('ar'));
  document.body.classList.remove('ar');
  if(cur)cur.scale.setScalar(1);
  setTimeout(()=>fit&&fit(),80);
}

function go(s){
  stopAR();screen=s;pt.clear();EX=0;exv=0;
  const h=s==='portada'?rPortada():s==='menu'?rMenu():s==='contenidos'?rContenidos():s==='ind'?rInd():s==='video'?rVideo():s==='q'?rQuiz():/^f\d$/.test(s)?rFund(+s[1]):/^c\d$/.test(s)?rContent(+s.slice(1)):rPortada();
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('fbtn').style.display=(/^f\d$/.test(s)||s==='menu')?'none':'flex';
  if(s==='portada')setTimeout(()=>{init3D('hv','mini',null);rTb()},50);
  else if(/^c\d$/.test(s)){const c=CONT[+s.slice(1)];gone=[];on=1;setTimeout(()=>{init3D('vv',c.s,c.l);rTb()},50)}
  else if(s==='q'&&stage==='q'&&!finished){const q=QS[qi],circ=q.model==='serie'||q.model==='par';gone=[];on=1;setTimeout(()=>init3D('qv',circ?q.model:'items',circ?null:[q.model],!answered&&!circ),50)}
}
function startQ(){qi=0;score=0;answered=false;picked=null;finished=false;stage='q';go('q')}
function ans(j){if(answered)return;answered=true;picked=j;if(j===QS[qi].answer)score++;stage='fb';go('q')}
function nextQ(){if(qi<QS.length-1){qi++;answered=false;picked=null}else finished=true;stage='q';go('q')}

go('portada');
addEventListener('resize',()=>{if(window._resize)window._resize()});
loop();
</script>
